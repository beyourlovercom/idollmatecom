name: R7 Catalog and Home Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r7-isolated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -v
          find wordpress/plugins/idollmate-catalog wordpress/plugins/idollmate-home wordpress/plugins/idollmate-storefront wordpress/plugins/idollmate-discovery -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l tests/idollmate_catalog_smoke.php
          php -l tests/idollmate_home_smoke.php
          php -l tests/idollmate_storefront_smoke.php
          php -l tests/r8_discovery_smoke.php
      - name: Isolated unit smoke tests
        run: |
          php tests/idollmate_catalog_smoke.php
          php tests/idollmate_home_smoke.php
          php tests/idollmate_storefront_smoke.php
          php tests/r8_discovery_smoke.php

      - name: Checkout Block browser diagnostic syntax (does not run browser or submit orders)
        run: node --check scripts/uat/r7_checkout_block_diagnostic.cjs
