name: R8 Catalog CSV Preflight

on:
  pull_request:
    paths:
      - 'scripts/catalog/**'
      - 'tests/test_r8_catalog_*.py'
      - 'wordpress/plugins/idollmate-discovery/**'
      - 'tests/r8_discovery_smoke.php'
      - 'docs/architecture/R8_CATALOG_SCHEMA_V1.md'
      - '.github/workflows/r8-catalog-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile scripts/catalog/r8_catalog_preflight.py scripts/catalog/r8_catalog_batch.py tests/test_r8_catalog_preflight.py tests/test_r8_catalog_batch.py
      - name: Guarded Woo adapter PHP syntax only (never executes Dev writes)
        run: |
          php -l scripts/catalog/r8_woo_dev_snapshot.php
          php -l scripts/catalog/r8_woo_dev_guarded_apply.php
          php -l scripts/catalog/r8_woo_batch_guards.php
          php -l tests/r8_woo_batch_guards_test.php
          php -l wordpress/plugins/idollmate-discovery/idollmate-discovery.php
          php -l tests/r8_discovery_smoke.php
          php tests/r8_woo_batch_guards_test.php
          php tests/r8_discovery_smoke.php
      - name: Isolated tests, including 2000-SKU and batch rollback
        run: |
          python -m unittest discover -s tests -p 'test_r8_catalog_*.py' -v
